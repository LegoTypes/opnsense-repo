# What the LegoTypes workflows build, and from where. One package per line:
#   package  source-repository  branch  directory  catalogue
# Every package builds inside the opnsense/plugins commit repo.conf pins (FRAMEWORK),
# with the package directory copied in. A plugin row's directory comes from its
# repository's main; source repository "." is this repository at the run's commit.
# catalogue=yes rows form the signed package repository (publish.yml); catalogue=no
# marks a release-only build that never enters it (none exists today).
os-wg-client-tunnels  LegoTypes/plugins  main                 net/wg-client-tunnels  yes
os-mac-alias-cache    LegoTypes/plugins  main                 net/mac-alias-cache    yes
os-wan-failover       LegoTypes/plugins  main                 net/wan-failover       yes
os-unbound-upstream   LegoTypes/plugins  main                 dns/unbound-upstream   yes
os-legotypes          .                  main                 vendor/legotypes       yes
