# What the LegoTypes workflows build, and from where. One package per line:
#   package  source-repository  branch  directory  catalogue
# Source repository "." is this repository at the run's commit (built inside a
# LegoTypes/plugins master checkout, for its Mk/). catalogue=yes rows form the
# signed package repository (publish.yml); catalogue=no rows are release-only
# builds (avahi.yml) that never enter it.
os-wg-client-tunnels  LegoTypes/plugins  add-wg-ipv6-gateway  net/wg-client-tunnels  yes
os-mac-alias-cache    LegoTypes/plugins  add-mac-alias-cache  net/mac-alias-cache    yes
os-wan-failover       LegoTypes/plugins  add-wan-failover     net/wan-failover       yes
os-avahi-reflector    LegoTypes/plugins  add-avahi-reflector  net/avahi-reflector    no
os-legotypes          .                  main                 vendor/legotypes       yes
