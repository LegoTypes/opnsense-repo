# The served package repository. ABI and SERIES are what every build targets;
# SERVE lists every <ABI>/<series> tree the Pages site serves (a series or ABI
# change serves the old and the new together until the firewall has moved, each
# under the ABI its firewalls ask for; see README: Series change).
ABI=FreeBSD:15:amd64
SERIES=26.7
SERVE=FreeBSD:15:amd64/26.7
# yes: carry-forward refuses any release that is not immutable. Flip to yes once every
# package has republished since immutable releases were turned on (2026-10-20).
REQUIRE_IMMUTABLE_RELEASES=no
# The pkg that signs the catalogue on the runner (scripts/pkg-tool.sh): freebsd/pkg
# at tag 2.8.4 (OPNsense 26.7 ships pkg 2.8.4_1), and the sha256 of GitHub's archive
# of that commit (https://github.com/freebsd/pkg/archive/<commit>.tar.gz). Move both
# together, to a release tag no older than the pkg the served series ships.
PKG_TOOL_COMMIT=e1d90eb706cbb4588bbd71bf205843b751c0be51
PKG_TOOL_SHA256=911b71822b9a22622a765ae6971645af2acf54470d3d5a40d76f5e3de76ed6eb
