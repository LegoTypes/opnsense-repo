# The served package repository. ABI and SERIES are what every build targets;
# SERVE lists every <ABI>/<series> tree the Pages site serves (a series or ABI
# change serves the old and the new together until the firewall has moved, each
# under the ABI its firewalls ask for; see README: Series change).
ABI=FreeBSD:15:amd64
SERIES=26.7
SERVE=FreeBSD:15:amd64/26.7
