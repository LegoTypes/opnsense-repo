name: build

# One package from packages.conf, in three jobs, each on a runner of its own:
#   build   builds it in a FreeBSD 15 VM. The VM, the action that runs it and whatever they
#           download share this runner, so after the VM the job only checks out/ and uploads
#           it as the artifact "package" (the .pkg, and the VM's source and build lines).
#   review  on a fresh runner, with this repository's scripts and GitHub's actions only:
#           composes the release notes' lines from trusted inputs, checks the version is new,
#           writes the manifest, runs the payload check and writes the summary the owner reads
#           before approving; uploads the artifact "review" (manifest, source, build).
#   sign    in the "release" environment (its approval and its one secret): checks the build
#           against the plugin source at the approved commit, carries every other catalogue
#           package forward from the releases the review job's manifest names, signs the
#           catalogue and uploads the Pages site for the caller to deploy.
# No job has a secret but sign. The caller turns the build into a release once everything else
# has succeeded, with the review job's lines.
on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      commit:
        description: The full commit to build, as the owner approved it
        type: string
        required: true
      catalogue:
        type: boolean
        required: true
    outputs:
      tag:
        description: The release tag the build will get, <name>-<version>
        value: ${{ jobs.review.outputs.tag }}
      # the sha256 of the package and of the review files, as the review job showed them
      pkg_sha256:
        value: ${{ jobs.review.outputs.pkg_sha256 }}
      manifest_sha256:
        value: ${{ jobs.review.outputs.manifest_sha256 }}
      source_sha256:
        value: ${{ jobs.review.outputs.source_sha256 }}
      build_sha256:
        value: ${{ jobs.review.outputs.build_sha256 }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    # No environment and no secret: nothing this job does after the VM is trusted, and the
    # review and sign jobs check what it uploads.
    permissions:
      contents: read
    env:
      PACKAGE: ${{ inputs.package }}
      CATALOGUE: ${{ inputs.catalogue }}
      COMMIT: ${{ inputs.commit }}
    steps:
      # no token in .git: the workspace is copied into the build VM
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history: the vendor package's source line names the last commit that changed it
          fetch-depth: 0

      # the commit is not repeated in a message: a newline in it would start a workflow command
      - name: Check the package and the commit
        run: |
          if ! [[ $COMMIT =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit must be the full 40 lower-case hex digits"
            exit 1
          fi
          row=$(sh scripts/packages.sh row "$PACKAGE")
          read -r repo _branch _dir listed <<<"$row"
          if [ "$repo" = . ] && [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::$PACKAGE is built from this repository at the run's commit $GITHUB_SHA, not the commit given: dispatch from main at that commit"
            exit 1
          fi
          want=no
          [ "$CATALOGUE" != true ] || want=yes
          if [ "$listed" != "$want" ]; then
            echo "::error::$PACKAGE has catalogue=$listed in packages.conf; this workflow builds catalogue=$want packages"
            exit 1
          fi

      # PHP and Python of the series we build for, from OPNsense's mirror; the run
      # fails rather than build with stale values
      - name: Upstream facts
        run: |
          bash scripts/upstream.sh > upstream.env
          cat upstream.env
          sed -n 's/^\(PHP\|PYTHON\)=/UPSTREAM_\1=/p' upstream.env >> "$GITHUB_ENV"

      # the VM syncs the workspace back, scripts/ included: the out/ check runs from a copy
      # taken before it ran
      - name: Keep out-dir.sh out of the VM's reach
        run: cp scripts/out-dir.sh "$RUNNER_TEMP/out-dir.sh"

      - name: Build in FreeBSD 15
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: "15"
          usesh: true
          envs: PACKAGE COMMIT GITHUB_REPOSITORY GITHUB_SHA UPSTREAM_PHP UPSTREAM_PYTHON
          prepare: pkg install -y git
          run: |
            set -e
            umask 022
            sh scripts/build-package.sh "$PACKAGE" "$COMMIT"

      # regular files of the expected names only: upload-artifact follows symlinks
      - name: Check out/
        run: bash "$RUNNER_TEMP/out-dir.sh" "$PACKAGE" out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: out/
          if-no-files-found: error

  review:
    needs: build
    runs-on: ubuntu-24.04
    # A runner the VM never touched; no environment and no secret. Nothing here prints the
    # package's text to the log: the summary goes to the summary file, and every message
    # quotes what it names.
    permissions:
      contents: read
    # job outputs only this job's runner can set: they bind the artifacts sign and release
    # use to what the approver read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      pkg_sha256: ${{ steps.sums.outputs.pkg_sha256 }}
      manifest_sha256: ${{ steps.sums.outputs.manifest_sha256 }}
      source_sha256: ${{ steps.sums.outputs.source_sha256 }}
      build_sha256: ${{ steps.sums.outputs.build_sha256 }}
    env:
      PACKAGE: ${{ inputs.package }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history: the vendor package's source line names the last commit that changed it
          fetch-depth: 0

      # data for the payload check, never run: exported before any artifact reaches the workspace, so nothing
      # the build made can be among its inputs (the checkout and packages.conf, or a fresh clone from GitHub)
      - name: The plugin source at the commit
        id: source
        run: |
          dir=$(bash scripts/plugin-source.sh "$PACKAGE" "$RUNNER_TEMP/source")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out

      - name: Check the build
        run: bash scripts/out-dir.sh "$PACKAGE" out

      - name: Upstream facts
        run: |
          bash scripts/upstream.sh > upstream.env
          cat upstream.env
          sed -n 's/^\(PHP\|PYTHON\)=/UPSTREAM_\1=/p' upstream.env >> "$GITHUB_ENV"

      - name: The release notes' source and build lines
        run: bash scripts/provenance.sh "$PACKAGE" out review

      - name: Check the version is new
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(bash scripts/release.sh check out/*.pkg)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # what firewalls are served now (each served tree's packages.txt), checked against the releases
          LIVE_SITE: https://legotypes.github.io/opnsense-repo
        run: |
          bash scripts/manifest.sh "$PACKAGE" out
          mv out/manifest review/manifest

      - name: Tools for the payload check, from Ubuntu's archive
        run: bash scripts/ubuntu-apt.sh libarchive-tools zstd

      - name: Summary for the approver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_DIR: ${{ steps.source.outputs.dir }}
        run: bash scripts/summary.sh "$PACKAGE" out review >> "$GITHUB_STEP_SUMMARY"

      - name: The sha256 of what the summary shows
        id: sums
        run: bash scripts/review-sums.sh print "$PACKAGE" out review >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review
          path: review/
          if-no-files-found: error

  sign:
    needs: review
    if: inputs.catalogue
    runs-on: ubuntu-24.04
    # PKG_SIGNING_KEY is a secret of the "release" environment, which runs only from main and
    # only after the owner approves the run, having read the review job's summary. A job
    # calling a reusable workflow cannot name an environment, so it is named here. Every
    # action is GitHub's own, pinned to a commit; the rest is this repository's scripts, pkg
    # built from a pinned source and Ubuntu's archive, all before the key is staged.
    environment: release
    permissions:
      contents: read
    # the signing helper reads from pkg without a timeout
    timeout-minutes: 30
    env:
      PACKAGE: ${{ inputs.package }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # data for the payload check, never run: exported before any artifact reaches the workspace, so nothing
      # the build made can be among its inputs (the checkout and packages.conf, or a fresh clone from GitHub)
      - name: The plugin source at the commit
        id: source
        run: |
          dir=$(bash scripts/plugin-source.sh "$PACKAGE" "$RUNNER_TEMP/source")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - id: package
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out

      - id: review
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review
          path: review

      # the artifacts must be the files the review job summed, which the approver read
      - name: Check the build
        env:
          PACKAGE_ARTIFACT: ${{ steps.package.outcome }}
          REVIEW_ARTIFACT: ${{ steps.review.outcome }}
          PKG_SHA256: ${{ needs.review.outputs.pkg_sha256 }}
          MANIFEST_SHA256: ${{ needs.review.outputs.manifest_sha256 }}
          SOURCE_SHA256: ${{ needs.review.outputs.source_sha256 }}
          BUILD_SHA256: ${{ needs.review.outputs.build_sha256 }}
        run: |
          if [ "$PACKAGE_ARTIFACT" != success ] || [ "$REVIEW_ARTIFACT" != success ]; then
            echo "::error::no package artifact: re-run the whole workflow"
            exit 1
          fi
          bash scripts/out-dir.sh "$PACKAGE" out
          bash scripts/review-sums.sh check "$PACKAGE" out review

      - name: Tools for the payload check, from Ubuntu's archive
        run: bash scripts/ubuntu-apt.sh libarchive-tools zstd

      # The package's install scripts are printed, and no line of them may be read as a
      # workflow command: commands stop until a token the package cannot know.
      - name: The build is exactly the source at the commit
        env:
          PLUGIN_DIR: ${{ steps.source.outputs.dir }}
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          rc=0
          bash scripts/payload.sh "$PACKAGE" out "$PLUGIN_DIR" || rc=$?
          echo "::$token::"
          exit "$rc"

      # the approval can come hours after the review job's check
      - name: Check the version is still new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh check out/*.pkg

      # pkg repo needs no FreeBSD host; built before the key is staged, as apt runs as root
      - name: Build pkg from its pinned source
        id: pkg
        run: |
          pkg=$(bash scripts/pkg-tool.sh "$RUNNER_TEMP/pkg-tool")
          echo "path=$pkg" >> "$GITHUB_OUTPUT"

      - name: Carry forward the other catalogue packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # what firewalls are served now (each served tree's packages.txt), checked against the releases
          LIVE_SITE: https://legotypes.github.io/opnsense-repo
          # the releases carried must be those of the manifest the owner approved
          MANIFEST: review/manifest
        run: bash scripts/carry-forward.sh "$PACKAGE"

      # The signing key goes into the workspace, never into site/; sign-catalogue.sh removes
      # it when it exits, and the step after it does whatever happened.
      - name: Stage the signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -z "$PKG_SIGNING_KEY" ]; then
            echo "::error::PKG_SIGNING_KEY is empty: the caller must pass secrets: inherit"
            exit 1
          fi
          umask 077
          mkdir -p .signing
          printf '%s\n' "$PKG_SIGNING_KEY" > .signing/key

      # packages.txt repeats what each package's manifest says, so commands stop here too
      - name: Sign the catalogue
        env:
          PKG: ${{ steps.pkg.outputs.path }}
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          rc=0
          sh scripts/sign-catalogue.sh || rc=$?
          echo "::$token::"
          exit "$rc"

      - name: Remove the signing key
        if: always()
        run: rm -rf .signing

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
