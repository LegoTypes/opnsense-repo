name: avahi

# Build os-avahi-reflector as a release only. It is being retired in favour of
# net/netflector and is not in the LegoTypes catalogue, so no firewall is
# offered it; a release is installed by hand ("pkg add" of the release asset,
# after checking the sha256 in its notes). Version 1.0 exists only in the old
# all-package release publish-9: bump the branch to 1.0_1 (PLUGIN_WWW moves off
# the retired page) before the first run, or this builds a second, different 1.0.
on: workflow_dispatch

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      package: os-avahi-reflector
      catalogue: false

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out
      - name: Record the build as release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh create out/*.pkg "$(cat out/source)"
