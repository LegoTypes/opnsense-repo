name: publish

# Publish one catalogue package: build it, carry the other catalogue packages
# forward from their releases unchanged, sign the catalogue and deploy it to
# GitHub Pages, then record the build as release <name>-<version>. Nothing else
# is rebuilt, so work on another plugin's branch never ships with this one.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - os-wg-client-tunnels
          - os-mac-alias-cache
          - os-legotypes

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ inputs.package }}
      catalogue: true
    # A called workflow sees only the secrets its caller passes, even for the
    # environment its job names: without this PKG_SIGNING_KEY arrives empty
    # (publish run 36602098610 deployed a catalogue with empty signatures).
    # The repository and organization hold no other secrets.
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # only after the deploy: a failed deploy leaves no release, so the same
  # version can be published again
  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out
      - name: Record the build as release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh create out/*.pkg "$(cat out/source)"
