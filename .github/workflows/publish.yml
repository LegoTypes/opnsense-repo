name: publish

# Publish one catalogue package at the commit the owner names: build it (build.yml's
# build job, no secret), review it on a runner of its own (build.yml's review job, which
# writes the summary), and once the owner has read that summary and approved the
# "release" environment, check it against that commit's source, carry the other
# catalogue packages forward from their releases unchanged and sign the catalogue
# (build.yml's sign job); deploy it to GitHub Pages, then record the build as release
# <name>-<version>. Nothing else is rebuilt, so work on another plugin's branch never
# ships with this one.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - os-wg-client-tunnels
          - os-mac-alias-cache
          - os-wan-failover
          - os-unbound-upstream
          - os-legotypes
      commit:
        description: >-
          The full 40-character commit to build and publish (git rev-parse origin/main for
          os-legotypes; a commit on the package's branch otherwise)
        type: string
        required: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ inputs.package }}
      commit: ${{ inputs.commit }}
      catalogue: true
    # A called workflow sees only the secrets its caller passes, even for the
    # environment its job names: without this PKG_SIGNING_KEY arrives empty
    # (publish run 36602098610 deployed a catalogue with empty signatures).
    # The repository and organization hold no other secrets.
    secrets: inherit

  # "build" is the whole of build.yml, its sign job included (a caller cannot name a
  # called workflow's jobs), so the deploy waits for the signed catalogue
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # only after the deploy: a failed deploy leaves no release, so the same
  # version can be published again. The notes carry the review job's source and build
  # lines, never the build VM's.
  release:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review
          path: review
      - name: Record the build as release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
          COMMIT: ${{ inputs.commit }}
          # the files must be those the review job summed, which the approver read
          PKG_SHA256: ${{ needs.build.outputs.pkg_sha256 }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          SOURCE_SHA256: ${{ needs.build.outputs.source_sha256 }}
          BUILD_SHA256: ${{ needs.build.outputs.build_sha256 }}
        run: |
          bash scripts/out-dir.sh "$PACKAGE" out
          bash scripts/review-sums.sh check "$PACKAGE" out review
          bash scripts/release.sh create out/*.pkg "$(cat review/source)" review/build
